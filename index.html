<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reztroid Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="text-slate-800">

  <nav class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
     <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-violet-600 text-white rounded-lg flex items-center justify-center font-bold">R</div>
        <div class="flex items-center gap-2">
           <span class="font-bold text-xl tracking-tight">reztroid<span class="text-xs align-top text-slate-400 font-normal ml-1">®</span></span>
           <span class="px-2 py-1 bg-violet-50 text-violet-600 text-[10px] font-bold rounded-full tracking-wide">ADMIN DASHBOARD</span>
        </div>
     </div>
     <button onclick="fetchData()" class="px-4 py-2 bg-slate-50 border border-slate-200 text-slate-600 rounded-full text-sm font-bold hover:bg-slate-100 transition flex items-center gap-2">
        🔄 Refresh Data
     </button>
  </nav>

  <div class="max-w-6xl mx-auto p-6 space-y-10 mt-4">
    
    <div class="bg-gradient-to-br from-violet-500 to-indigo-600 rounded-[2rem] p-8 md:p-10 text-white flex flex-col md:flex-row justify-between shadow-lg shadow-indigo-200 relative overflow-hidden items-center gap-8">
       <div class="absolute -right-20 -top-20 w-64 h-64 bg-white opacity-5 rounded-full blur-2xl"></div>
       <div class="relative z-10 w-full md:w-1/2">
          <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/20 rounded-full text-xs font-bold mb-6 backdrop-blur-sm">📊 RINGKASAN PENJUALAN</span>
          <h2 class="text-3xl font-extrabold mb-2 leading-tight">Pantau Keuangan &<br>Perpanjangan Aktif.</h2>
          <p class="text-indigo-100 text-sm mb-6 max-w-sm">Data langsung tersinkronisasi ke Google Sheets Anda secara real-time.</p>
          <button onclick="document.getElementById('modalOrder').classList.remove('hidden')" class="px-6 py-3 bg-[#beff3b] text-slate-900 text-sm font-bold rounded-full hover:bg-[#a6e62e] transition shadow-md flex items-center gap-2">
             + Tambah Order Baru
          </button>
       </div>
       <div class="relative z-10 w-full md:w-1/2 grid grid-cols-2 gap-6 bg-white/10 p-6 rounded-3xl backdrop-blur-md border border-white/20">
          <div>
             <p class="text-xs text-indigo-200 font-medium mb-1 uppercase tracking-wider">Total Omzet</p>
             <p class="text-2xl lg:text-3xl font-bold tracking-tight" id="ui-omzet">Rp0</p>
          </div>
          <div>
             <p class="text-xs text-indigo-200 font-medium mb-1 uppercase tracking-wider">Total Profit</p>
             <p class="text-2xl lg:text-3xl font-bold text-lime-300 tracking-tight" id="ui-profit">Rp0</p>
          </div>
       </div>
    </div>

    <div>
       <div class="flex justify-between items-end mb-6">
          <div>
             <h3 class="text-xl font-bold text-slate-800 mb-1">Daftar Pelanggan H-2</h3>
             <p class="text-sm text-slate-500">Perlu Diingatkan: <span id="ui-reminder-count" class="font-bold text-violet-600">0</span> Pelanggan</p>
          </div>
          <select id="filterLayanan" onchange="applyFilter()" class="px-4 py-2 bg-white border border-slate-200 rounded-full text-sm font-bold text-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500">
             <option value="Semua">Semua Layanan</option>
             <option value="Canva">Canva</option>
             <option value="Viu">Viu</option>
             <option value="Spotify">Spotify</option>
             <option value="Netflix">Netflix</option>
             <option value="Capcut">Capcut</option>
          </select>
       </div>
       <div id="reminder-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          <p class="text-slate-400 text-sm col-span-full">Mengambil data dari server...</p>
       </div>
    </div>
  </div>

  <div id="modalOrder" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
     <div class="bg-white rounded-[2rem] w-full max-w-md p-8 shadow-xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="document.getElementById('modalOrder').classList.add('hidden')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
        <h3 class="text-2xl font-bold text-slate-800 mb-6">Order Baru</h3>
        
        <form id="formOrder" onsubmit="submitOrder(event)" class="space-y-4">
           <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Nama Pelanggan</label>
              <input type="text" id="inputNama" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="Misal: Budi">
           </div>
           
           <div class="grid grid-cols-2 gap-4">
              <div>
                 <label class="block text-xs font-bold text-slate-500 mb-1">Layanan</label>
                 <select id="inputLayanan" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
                    <option value="Canva">Canva</option>
                    <option value="Viu">Viu</option>
                    <option value="Spotify">Spotify</option>
                    <option value="Netflix">Netflix</option>
                    <option value="Capcut">Capcut</option>
                 </select>
              </div>
              <div>
                 <label class="block text-xs font-bold text-slate-500 mb-1">No. WhatsApp</label>
                 <input type="number" id="inputWA" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="62812...">
              </div>
           </div>
           <div class="grid grid-cols-2 gap-4">
              <div>
                 <label class="block text-xs font-bold text-slate-500 mb-1">Omzet (Rp)</label>
                 <input type="number" id="inputOmzet" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="50000">
              </div>
              <div>
                 <label class="block text-xs font-bold text-slate-500 mb-1">Profit (Rp)</label>
                 <input type="number" id="inputProfit" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="25000">
              </div>
           </div>
           
           <button type="submit" id="btnSubmit" class="w-full py-3 mt-4 bg-violet-600 text-white font-bold rounded-xl hover:bg-violet-700 transition">
              Simpan Data
           </button>
        </form>
     </div>
  </div>

  <script>
    // MASUKKAN LINK APPS SCRIPT BARU KAMU DI BAWAH INI (JANGAN LUPA TANDA KUTIP)
    const SCRIPT_URL = 'TARUH_LINK_BARU_DI_SINI';
    
    let allReminders = [];

    async function fetchData() {
      const container = document.getElementById('reminder-list');
      container.innerHTML = '<p class="text-slate-400 text-sm col-span-full animate-pulse">Mensinkronkan data dengan Google Sheets...</p>';
      
      try {
        const response = await fetch(SCRIPT_URL, {
            method: 'GET',
            mode: 'cors'
        });
        
        const data = await response.json();
        processDashboard(data);
      } catch (error) {
        container.innerHTML = `<p class="text-red-500 text-sm col-span-full font-bold">Gagal memuat data: Google memblokir koneksi atau link salah. Coba refresh.</p>`;
        console.error("Error Fetch:", error);
      }
    }

    function parseRupiah(str) {
        if (!str) return 0;
        let num = String(str).replace(/[^0-9]/g, '');
        return Number(num) || 0;
    }

    function processDashboard(orders) {
      let totalOmzet = 0;
      let totalProfit = 0;
      allReminders = [];

      const hariIni = new Date();
      hariIni.setHours(0,0,0,0);

      orders.forEach(order => {
        if(order.Omzet) totalOmzet += parseRupiah(order.Omzet);
        if(order.Profit) totalProfit += parseRupiah(order.Profit);

        if (order.Status_H2 && String(order.Status_H2).includes("H-2")) {
             allReminders.push(order);
        }
      });

      const formatRp = (angka) => new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
      document.getElementById('ui-omzet').innerText = formatRp(totalOmzet);
      document.getElementById('ui-profit').innerText = formatRp(totalProfit);
      
      applyFilter();
    }

    function applyFilter() {
       const filterValue = document.getElementById('filterLayanan').value;
       let filteredData = allReminders;
       
       if (filterValue !== 'Semua') {
          filteredData = allReminders.filter(order => order.Layanan && order.Layanan.toLowerCase().includes(filterValue.toLowerCase()));
       }
       
       document.getElementById('ui-reminder-count').innerText = filteredData.length;
       renderReminders(filteredData);
    }

    function renderReminders(reminders) {
      const container = document.getElementById('reminder-list');
      if (reminders.length === 0) {
        container.innerHTML = `<div class="col-span-full flex flex-col items-center justify-center p-10 bg-white rounded-2xl border border-slate-100 shadow-sm"><span class="text-4xl mb-3">🎉</span><p class="text-sm text-slate-500 font-bold">Aman! Tidak ada antrian H-2 hari ini.</p></div>`;
        return;
      }

      container.innerHTML = '';
      reminders.forEach(order => {
        const waLink = order.Link_WA || `https://wa.me/${order.No_WA}`;
        const tglBerakhir = order.Tgl_Berakhir ? String(order.Tgl_Berakhir).split(' ')[0] : '-';

        container.innerHTML += `
          <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex flex-col relative group">
            <div class="flex justify-between items-start mb-4">
               <div class="w-10 h-10 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center font-bold text-sm">
                  ${order.Layanan ? order.Layanan.charAt(0) : '📦'}
               </div>
               <div class="text-right">
                  <p class="text-[10px] font-bold text-slate-400 uppercase">Berakhir</p>
                  <p class="text-xs font-bold text-red-500">${tglBerakhir}</p>
               </div>
            </div>
            <h4 class="font-bold text-slate-800 text-lg line-clamp-1">${order.Nama_Pelanggan}</h4>
            <p class="text-xs text-slate-500 mb-6">${order.Layanan} • ${order.ID_Order}</p>
            
            <div class="flex gap-2 mt-auto">
               <a href="${waLink}" target="_blank" class="flex-1 px-4 py-2 bg-slate-900 text-white text-xs font-bold rounded-full hover:bg-slate-800 transition flex items-center justify-center">
                  💬 Kirim WA
               </a>
            </div>
          </div>
        `;
      });
    }

    async function submitOrder(e) {
       e.preventDefault();
       const btn = document.getElementById('btnSubmit');
       btn.innerText = "Menyimpan ke Sheets..."; btn.disabled = true;

       const idOrder = "RZT-" + Math.floor(1000 + Math.random() * 9000);
       
       // Format Tanggal 1 Bulan ke Depan
       const tgl = new Date();
       tgl.setMonth(tgl.getMonth() + 1); 
       const dd = String(tgl.getDate()).padStart(2, '0');
       const mm = String(tgl.getMonth() + 1).padStart(2, '0'); 
       const yyyy = tgl.getFullYear();
       const tglBerakhir = dd + '/' + mm + '/' + yyyy;
       
       const payload = {
          action: 'add',
          data: {
             ID_Order: idOrder,
             Nama_Pelanggan: document.getElementById('inputNama').value,
             Layanan: document.getElementById('inputLayanan').value,
             Tgl_Berakhir: tglBerakhir,
             No_WA: document.getElementById('inputWA').value,
             Omzet: document.getElementById('inputOmzet').value,
             Profit: document.getElementById('inputProfit').value
          }
       };

       try {
          const response = await fetch(SCRIPT_URL, {
             method: 'POST',
             body: JSON.stringify(payload)
             // Sengaja tidak pakai headers Content-Type agar tembus CORS Google
          });
          const result = await response.json();
          if(result.success) {
             document.getElementById('formOrder').reset();
             document.getElementById('modalOrder').classList.add('hidden');
             fetchData(); // Refresh UI langsung
          }
       } catch (error) {
          alert("Gagal menyimpan ke Sheets. Periksa koneksi atau link SCRIPT_URL.");
       }
       
       btn.innerText = "Simpan Data"; btn.disabled = false;
    }

    // Panggil data pertama kali
    fetchData();
  </script>
</body>
</html>
