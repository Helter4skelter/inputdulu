<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reztroid Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #f8fafc; font-family: sans-serif; }
    ::-webkit-scrollbar { width: 0px; background: transparent; }
  </style>
</head>
<body class="text-slate-800">

  <!-- Navbar -->
  <nav class="bg-white border-b border-slate-100 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
     <div class="flex items-center gap-3">
        <div class="w-8 h-8 bg-violet-600 text-white rounded-lg flex items-center justify-center font-bold">R</div>
        <div class="flex items-center gap-2">
           <span class="font-bold text-xl tracking-tight">reztroid<span class="text-xs align-top text-slate-400 font-normal ml-1">®</span></span>
           <span class="px-2 py-1 bg-violet-50 text-violet-600 text-[10px] font-bold rounded-full tracking-wide">ADMIN DASHBOARD</span>
        </div>
     </div>
     <button onclick="fetchData()" class="px-4 py-2 bg-slate-50 border border-slate-200 text-slate-600 rounded-full text-sm font-bold hover:bg-slate-100 transition flex items-center gap-2">
        🔄 Refresh Data
     </button>
  </nav>

  <div class="max-w-6xl mx-auto p-6 space-y-10 mt-4">
    
    <!-- Banner Statistik -->
    <div class="bg-gradient-to-br from-violet-500 to-indigo-600 rounded-[2rem] p-8 md:p-10 text-white flex flex-col md:flex-row justify-between shadow-lg shadow-indigo-200 relative overflow-hidden items-center gap-8">
       <div class="absolute -right-20 -top-20 w-64 h-64 bg-white opacity-5 rounded-full blur-2xl"></div>
       <div class="relative z-10 w-full md:w-1/2">
          <span class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/20 rounded-full text-xs font-bold mb-6 backdrop-blur-sm">📊 RINGKASAN PENJUALAN</span>
          <h2 class="text-3xl font-extrabold mb-2 leading-tight">Pantau Keuangan &<br>Perpanjangan Aktif.</h2>
          <p class="text-indigo-100 text-sm mb-6 max-w-sm">Data langsung tersinkronisasi ke Google Sheets Anda secara real-time.</p>
          <button onclick="document.getElementById('modalOrder').classList.remove('hidden')" class="px-6 py-3 bg-[#beff3b] text-slate-900 text-sm font-bold rounded-full hover:bg-[#a6e62e] transition shadow-md flex items-center gap-2">
             + Tambah Order Baru
          </button>
       </div>
       <div class="relative z-10 w-full md:w-1/2 grid grid-cols-2 gap-6 bg-white/10 p-6 rounded-3xl backdrop-blur-md border border-white/20">
          <div>
             <p class="text-xs text-indigo-200 font-medium mb-1 uppercase tracking-wider">Total Omzet</p>
             <p class="text-2xl lg:text-3xl font-bold tracking-tight" id="ui-omzet">Rp0</p>
          </div>
          <div>
             <p class="text-xs text-indigo-200 font-medium mb-1 uppercase tracking-wider">Total Profit</p>
             <p class="text-2xl lg:text-3xl font-bold text-lime-300 tracking-tight" id="ui-profit">Rp0</p>
          </div>
       </div>
    </div>

    <!-- Filter & Daftar Pengingat -->
    <div>
       <div class="flex justify-between items-end mb-6">
          <div>
             <h3 class="text-xl font-bold text-slate-800 mb-1">Daftar Pelanggan H-2</h3>
             <p class="text-sm text-slate-500">Perlu Diingatkan: <span id="ui-reminder-count" class="font-bold text-violet-600">0</span> Pelanggan</p>
          </div>
          <select id="filterLayanan" onchange="applyFilter()" class="px-4 py-2 bg-white border border-slate-200 rounded-full text-sm font-bold text-slate-600 focus:outline-none focus:ring-2 focus:ring-violet-500">
             <option value="Semua">Semua Layanan</option>
             <option value="Canva">Canva</option>
             <option value="Viu">Viu</option>
             <option value="Spotify">Spotify</option>
             <option value="Netflix">Netflix</option>
             <option value="Capcut">Capcut</option>
          </select>
       </div>
       <div id="reminder-list" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-5">
          <p class="text-slate-400 text-sm col-span-full">Memuat data dari Google Sheets...</p>
       </div>
    </div>

  </div>

  <!-- Modal Tambah Order -->
  <div id="modalOrder" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
     <div class="bg-white rounded-[2rem] w-full max-w-md p-8 shadow-xl relative max-h-[90vh] overflow-y-auto">
        <button onclick="document.getElementById('modalOrder').classList.add('hidden')" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 text-xl font-bold">×</button>
        <h3 class="text-2xl font-bold text-slate-800 mb-6">Order Baru</h3>
        
        <form id="formOrder" onsubmit="submitOrder(event)" class="space-y-4">
           <div>
              <label class="block text-xs font-bold text-slate-500 mb-1">Nama Pelanggan</label>
              <input type="text" id="inputNama" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500" placeholder="Misal: Budi">
           </div>
           
           <div class="grid grid-cols-2 gap-4">
              <div>
                 <label class="block text-xs font-bold text-slate-500 mb-1">Layanan</label>
                 <select id="inputLayanan" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-violet-500">
                    <option value="Canva">Canva</option>
                    <option value="Viu">Viu</option>
                    <option value="Spotify">Spotify</option>
                    <option value="Netflix">Netflix</option>
                    <option value="Capcut">Capcut</option>
                 </select>
              </div>
              <div>
                 <label class="block text-xs font-bold text-slate-500 mb-1">No. WhatsApp</label>
                 <input type="number" id="inputWA" required class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring
